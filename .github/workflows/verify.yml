name: Power Zone verification
on:
  push:
    branches: [main, 'milestone-1/**', 'milestone-2/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build and type check
        run: pnpm build
      - name: Native PostgreSQL integration tests
        run: pnpm test
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests with native PostgreSQL
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
