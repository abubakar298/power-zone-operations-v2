name: Notification release verification
on:
  push:
    branches:
      [
        main,
        "milestone-1/**",
        "milestone-2/**",
        "milestone-3/**",
        "milestone-4/**",
        "milestone-5/**",
        "hardening/**",
      ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production dependency security audit
        run: pnpm audit --prod --audit-level high
      - name: Build and type check
        run: pnpm build
      - name: Focused account and notification security integration
        run: pnpm exec tsx --test --test-concurrency=1 tests/accounts.test.ts tests/email-sender.test.ts tests/notifications.test.ts tests/notification-http.test.ts tests/notification-webhooks.test.ts
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Notification browser acceptance with native PostgreSQL
        run: pnpm exec playwright test notifications.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-browser-evidence
          path: test-results/
          retention-days: 7
